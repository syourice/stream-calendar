<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配信カレンダー</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--tx:#1c1c22;--mut:#6b6b78;--bd:#e3e3ea;--acc:#e5334b}
@media (prefers-color-scheme:dark){:root{--bg:#15151a;--card:#1f1f26;--tx:#ececf1;--mut:#9a9aa8;--bd:#33333d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px}
h1{font-size:18px;margin:0}.sub{color:var(--mut);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;cursor:pointer;display:flex;align-items:center;gap:6px}
button{border-radius:8px}
.chip i{width:10px;height:10px;border-radius:50%}.chip.off{opacity:.4}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}.bar b{min-width:110px;text-align:center;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.dow{background:var(--card);text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.cell{background:var(--card);min-height:84px;padding:3px;cursor:pointer;overflow:hidden}
.cell.out{opacity:.45}.cell.sel{outline:2px solid var(--acc);outline-offset:-2px}
.cell .d{font-size:11px;color:var(--mut)}.cell.today .d{color:#fff;background:var(--acc);border-radius:999px;padding:0 6px}
.ev{display:block;font-size:10.5px;margin-top:2px;padding:1px 4px;border-radius:4px;color:#fff;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.end{opacity:.55}.more{font-size:10px;color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:12px}
.panel h2{font-size:14px;margin:0 0 8px}
.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.item:first-of-type{border-top:0}
.dot{width:8px;align-self:stretch;border-radius:4px;flex:none}.m{flex:1;min-width:0}.t{font-weight:600;word-break:break-word}
a.go{color:var(--acc);text-decoration:none;font-weight:600;white-space:nowrap}
.empty{color:var(--mut)}
@media(max-width:720px){.cell{min-height:64px}.ev{font-size:9.5px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>📺 配信カレンダー</h1><div class="sub"><span id="upd">読み込み中…</span> <button id="rf">再読込</button></div></header>
<div class="chips" id="chips"></div>
<div class="bar"><button id="prev">‹</button><b id="ym"></b><button id="next">›</button><button id="today">今日</button></div>
<div class="grid" id="grid"></div>
<div class="panel"><h2 id="dt"></h2><div id="dl"></div></div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},pad=function(n){return String(n).padStart(2,"0")};
var dkey=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var hm=function(d){return pad(d.getHours())+":"+pad(d.getMinutes())};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var D={channels:[],events:[],updated:null},hidden=[],HK="sc-hidden",loaded=0;
try{hidden=JSON.parse(localStorage.getItem(HK)||"[]")}catch(e){}
var n0=new Date(),cur=new Date(n0.getFullYear(),n0.getMonth(),1),sel=dkey(n0);
function ch(id){return D.channels.filter(function(c){return c.id===id})[0]}
function vis(){return D.events.filter(function(e){return hidden.indexOf(e.ch)<0&&ch(e.ch)}).map(function(e){e.d=new Date(e.start);return e}).sort(function(a,b){return a.d-b.d})}
function mark(e){return e.status==="live"?"🔴 ":""}
function render(){
  $("chips").innerHTML='<button class="chip" data-all="1">すべて</button>'+D.channels.map(function(c){return '<button class="chip'+(hidden.indexOf(c.id)>=0?" off":"")+'" data-id="'+c.id+'"><i style="background:'+c.color+'"></i>'+esc(c.name)+'</button>'}).join("");
  $("ym").textContent=cur.getFullYear()+"年"+(cur.getMonth()+1)+"月";
  var h="日月火水木金土".split("").map(function(d){return '<div class="dow">'+d+'</div>'}).join("");
  var f=new Date(cur.getFullYear(),cur.getMonth(),1),st=new Date(f.getFullYear(),f.getMonth(),1-f.getDay()),by={},tk=dkey(new Date());
  vis().forEach(function(e){var k=dkey(e.d);(by[k]=by[k]||[]).push(e)});
  for(var i=0;i<42;i++){
    var d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),k=dkey(d),l=by[k]||[];
    h+='<div class="cell'+(d.getMonth()!==cur.getMonth()?" out":"")+(k===sel?" sel":"")+(k===tk?" today":"")+'" data-day="'+k+'"><span class="d">'+d.getDate()+'</span>'+
      l.slice(0,3).map(function(e){return '<a class="ev'+(e.status==="none"?" end":"")+'" target="_blank" rel="noopener" href="'+esc(e.url)+'" style="background:'+ch(e.ch).color+'">'+mark(e)+hm(e.d)+" "+esc(e.title)+'</a>'}).join("")+
      (l.length>3?'<div class="more">+'+(l.length-3)+'件</div>':"")+'</div>';
  }
  $("grid").innerHTML=h;
  var p=sel.split("-");$("dt").textContent=p[0]+"年"+Number(p[1])+"月"+Number(p[2])+"日の配信";
  var dl=vis().filter(function(e){return dkey(e.d)===sel});
  $("dl").innerHTML=dl.length?dl.map(function(e){var c=ch(e.ch);return '<div class="item"><span class="dot" style="background:'+c.color+'"></span><div class="m"><div class="t">'+mark(e)+hm(e.d)+" "+esc(e.title)+'</div><div class="sub">'+esc(c.name)+(e.status==="none"?"（終了）":e.status==="upcoming"?"（予定）":"（配信中）")+'</div></div><a class="go" target="_blank" rel="noopener" href="'+esc(e.url)+'">YouTubeで開く ↗</a></div>'}).join(""):
    '<div class="empty">'+(D.channels.length?"この日の配信予定はありません":"まだデータがありません。channels.json にチャンネルを追加して、Actions を実行してください。")+'</div>';
  if(D.updated){var u=new Date(D.updated);$("upd").textContent="データ更新 "+(u.getMonth()+1)+"/"+u.getDate()+" "+hm(u)}
}
function load(){
  fetch("schedules.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){D=j;loaded=Date.now();render()})
  .catch(function(){$("upd").textContent="schedules.json を読み込めませんでした"});
}
$("chips").onclick=function(ev){var b=ev.target.closest("button");if(!b)return;
  if(b.dataset.all)hidden=[];else{var i=hidden.indexOf(b.dataset.id);if(i>=0)hidden.splice(i,1);else hidden.push(b.dataset.id)}
  try{localStorage.setItem(HK,JSON.stringify(hidden))}catch(e){}render()};
$("grid").onclick=function(ev){if(ev.target.closest("a"))return;var c=ev.target.closest(".cell");if(!c)return;sel=c.dataset.day;render()};
$("prev").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$("next").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$("today").onclick=function(){var n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1);sel=dkey(n);render()};
$("rf").onclick=load;
setInterval(load,3600*1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&Date.now()-loaded>600000)load()});
load();
})();
</script>
</body>
</html>
